{% extends "base.html" %}
{% block title %}Checkout • YOB_Crochê{% endblock %}
{% block content %}
<div class="container">
  <div class="checkout-box">
    <h2 style="color:#9B59B6;text-align:center;">Finalizar Pedido</h2>
    <form method="post">
      <div class="form-group">
        <label>Seu nome *</label>
        <input type="text" name="name" required value="{{ customer or '' }}">
      </div>
      <div class="form-group">
        <label>WhatsApp *</label>
        <input type="tel" name="phone" required value="{{ customer_contact or '' }}">
      </div>
      <div class="form-group">
        <label>Endereço / Bairro</label>
        <textarea name="address" rows="2" placeholder="Para entrega Uber Flex"></textarea>
      </div>
      <div class="form-group">
        <label>Forma de entrega</label>
        <select name="delivery" id="delivery" onchange="updFee()">
          <option value="retirada">Retirada no local (grátis)</option>
          <option value="uber">Uber Flex / Entrega (+ R$ 5,00)</option>
        </select>
        <small style="color:#888;">Taxa R$ 5,00 (pode variar conforme o bairro)</small>
      </div>
      <div class="form-group">
        <label>Forma de pagamento</label>
        <select name="payment">
          <option value="pix">Pix</option>
          <option value="whatsapp">Combinar no WhatsApp</option>
        </select>
      </div>
      <div style="text-align:right;margin:14px 0;">
        Subtotal: R$ {{ '%.2f'|format(subtotal) }}<br>
        Entrega: <span id="fee-label">R$ 0,00</span><br>
        <strong>Total: <span id="total-label">R$ {{ '%.2f'|format(subtotal) }}</span></strong>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Confirmar Pedido</button>
    </form>
  </div>
</div>
<script>
const sub = {{ subtotal }};
function updFee() {
  const fee = document.getElementById("delivery").value === "uber" ? 5 : 0;
  document.getElementById("fee-label").textContent = "R$ " + fee.toFixed(2).replace(".", ",");
  document.getElementById("total-label").textContent = "R$ " + (sub + fee).toFixed(2).replace(".", ",");
}
</script>
{% endblock %}
